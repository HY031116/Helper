<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>工作台助手</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body aria-busy="true">
  <!-- 自定义标题栏 -->
  <header class="titlebar">
    <div class="tb-left">
      <span class="tb-logo" aria-hidden="true">◐</span>
      <span class="tb-title" id="tb-title">工作台助手</span>
      <span class="tb-badge stage-local" id="tb-ai-stage">本地助手</span>
    </div>
    <div class="tb-right">
      <button type="button" class="tb-btn" id="tb-min" title="最小化" aria-label="最小化窗口">─</button>
      <button type="button" class="tb-btn" id="tb-max" title="最大化" aria-label="最大化窗口">□</button>
      <button type="button" class="tb-btn tb-close" id="tb-quit" title="关闭到托盘" aria-label="关闭到托盘">✕</button>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边导航 -->
    <nav class="sidebar" aria-label="主导航">
      <button type="button" class="sidebar-create" id="sidebar-new" aria-label="新建任务"><span aria-hidden="true">＋</span><span class="nav-label">新建任务</span></button>
      <div class="nav-section-label">工作</div>
      <button type="button" class="nav-item active" data-view="today" title="今天" aria-current="page"><span class="nav-ico">◐</span><span class="nav-label">今天</span><span class="nav-badge hidden"></span></button>
      <button type="button" class="nav-item" data-view="tasks" title="所有任务"><span class="nav-ico">☰</span><span class="nav-label">所有任务</span><span class="nav-badge hidden"></span></button>
      <button type="button" class="nav-item" data-view="memos" title="备忘录"><span class="nav-ico">✎</span><span class="nav-label">备忘录</span><span class="nav-badge hidden"></span></button>
      <div class="nav-section-label">视图</div>
      <button type="button" class="nav-item" data-view="board" title="看板"><span class="nav-ico">▤</span><span class="nav-label">看板</span></button>
      <button type="button" class="nav-item" data-view="cal" title="日历"><span class="nav-ico">▦</span><span class="nav-label">日历</span></button>
      <button type="button" class="nav-item" data-view="stat" title="统计"><span class="nav-ico">◫</span><span class="nav-label">统计</span></button>
      <button type="button" class="nav-item" data-view="trash" title="回收站"><span class="nav-ico">⌫</span><span class="nav-label">回收站</span><span class="nav-badge hidden"></span></button>
      <div class="nav-spacer"></div>
      <button type="button" class="nav-item" data-view="settings" title="设置"><span class="nav-ico">⚙</span><span class="nav-label">设置</span></button>
    </nav>

    <!-- 主内容区 -->
    <main class="content">
      <!-- 今日视图 -->
      <section class="view" id="view-today">
        <div class="view-head">
          <h2>今天 <span class="today-date" id="today-date"></span></h2>
          <span class="view-sub" id="today-sub"></span>
        </div>
        <div class="view-body" id="today-list">
          <div class="load-state" role="status" aria-live="polite">
            <span class="load-indicator" aria-hidden="true"></span>
            <div><strong>正在读取今日任务</strong><span>稍候即可开始工作</span></div>
          </div>
        </div>
      </section>

      <!-- 所有任务 -->
      <section class="view" id="view-tasks" style="display:none">
        <div class="view-head">
          <h2>所有任务</h2>
          <span class="view-sub" id="tasks-sub"></span>
        </div>
        <div class="toolbar">
          <div id="smart-filters" role="group" aria-label="任务筛选"></div>
          <div class="task-tools">
            <div class="task-search-row">
              <input id="search-input" type="search" aria-label="搜索任务" placeholder="搜索标题、描述、标签或项目">
              <button type="button" class="btn mini ghost" id="btn-select-mode" aria-pressed="false">批量操作</button>
            </div>
            <div class="quick-add">
              <input id="quick-input" aria-label="快速添加任务" placeholder="例如：明天下午3点 交周报 #工作 紧急">
              <button type="button" class="btn" id="btn-quick-add">快速添加</button>
              <button type="button" class="btn ghost" id="btn-new">详细创建</button>
            </div>
            <div class="quick-preview hidden" id="quick-preview" role="status" aria-live="polite"></div>
          </div>
        </div>
        <!-- 批量操作栏 -->
        <div class="batch-bar hidden" id="batch-bar">
          <span id="batch-count" aria-live="polite">请选择任务</span>
          <button type="button" class="btn mini ghost" id="batch-select-all">全选当前</button>
          <button type="button" class="btn mini" id="batch-done" disabled>✓ 完成</button>
          <select id="batch-pri" class="batch-pri" aria-label="批量修改优先级" disabled>
            <option value="">改优先级…</option>
            <option value="4">紧急</option>
            <option value="3">高</option>
            <option value="2">中</option>
            <option value="1">低</option>
          </select>
          <button type="button" class="btn mini danger" id="batch-delete" disabled>删除</button>
          <button type="button" class="btn mini ghost" id="batch-clear">退出批量</button>
        </div>
        <div class="view-body" id="tasks-list"></div>
      </section>

      <!-- 备忘录 -->
      <section class="view memo-view" id="view-memos" style="display:none">
        <div class="view-head">
          <h2>备忘录</h2>
          <span class="view-sub" id="memos-sub"></span>
        </div>
        <div class="memo-workspace">
          <div class="memo-sidebar">
            <div class="memo-search-row">
              <input id="memo-search" type="search" aria-label="搜索备忘录" placeholder="搜索标题、正文或标签">
              <button type="button" class="icon-btn memo-new" id="memo-new" title="新建备忘录" aria-label="新建备忘录">＋</button>
            </div>
            <div class="memo-list" id="memo-list" role="listbox" aria-label="备忘录列表"></div>
          </div>
          <div class="memo-pane">
            <div class="memo-load-error hidden" id="memo-load-error"></div>
            <div class="memo-empty" id="memo-empty">
              <span class="memo-empty-mark">✎</span>
              <strong>还没有备忘录</strong>
              <button type="button" class="btn mini" id="memo-empty-new">新建一条</button>
            </div>
            <div class="memo-editor hidden" id="memo-editor">
              <div class="memo-editor-head">
                <input id="memo-title" class="memo-title" maxlength="100" aria-label="备忘录标题" placeholder="无标题备忘录">
                <div class="memo-actions" role="group" aria-label="备忘录操作">
                  <div class="memo-action-group">
                    <button type="button" class="memo-tool" id="memo-pin" data-tooltip="置顶" aria-label="置顶备忘录" aria-pressed="false"><span aria-hidden="true">⌁</span></button>
                    <button type="button" class="memo-tool" id="memo-copy" data-tooltip="复制" aria-label="复制备忘录"><span aria-hidden="true">⧉</span></button>
                  </div>
                  <button type="button" class="memo-task-action" id="memo-to-task"><span aria-hidden="true">↗</span><span>转为任务</span></button>
                  <button type="button" class="memo-tool memo-delete-tool" id="memo-delete" data-tooltip="删除" aria-label="删除备忘录"><span aria-hidden="true">⌫</span></button>
                </div>
              </div>
              <input id="memo-tags" class="memo-tags" maxlength="120" aria-label="备忘录标签" placeholder="添加标签，用空格或逗号分隔">
              <textarea id="memo-content" class="memo-content" aria-label="备忘录正文" placeholder="写下需要记住的内容…"></textarea>
              <div class="memo-editor-foot">
                <span id="memo-save-state" role="status" aria-live="polite">已保存</span>
                <span id="memo-updated"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 看板 -->
      <section class="view" id="view-board" style="display:none">
        <div class="view-head">
          <h2>看板</h2>
          <span class="view-sub">拖拽卡片到目标列变更状态</span>
        </div>
        <div class="view-body" id="board-cols"></div>
      </section>

      <!-- 日历 -->
      <section class="view" id="view-cal" style="display:none">
        <div class="view-head">
          <h2>日历</h2>
          <span class="view-sub" id="cal-sub"></span>
        </div>
        <div class="view-body" id="cal-body"></div>
      </section>

      <!-- 统计 -->
      <section class="view" id="view-stat" style="display:none">
        <div class="view-head">
          <h2>统计</h2>
          <span class="view-sub">未归档任务全集 · 最近 7 个自然日</span>
        </div>
        <div class="view-body" id="stat-body"></div>
      </section>

      <!-- 回收站 -->
      <section class="view" id="view-trash" style="display:none">
        <div class="view-head">
          <h2>回收站</h2>
          <span class="view-sub">已删除的任务和备忘录可在此恢复</span>
        </div>
        <div class="toolbar view-actions">
          <button type="button" class="btn mini danger hidden" id="trash-empty">清空回收站</button>
        </div>
        <div class="view-body" id="trash-list"></div>
      </section>

      <!-- 设置 -->
      <section class="view" id="view-settings" style="display:none">
        <div class="view-head">
          <h2>设置</h2>
          <span class="view-sub">数据与偏好</span>
        </div>
        <div class="view-body" id="settings-body"></div>
      </section>
    </main>

    <!-- AI 助手面板 -->
    <aside class="ai-panel" id="ai-panel" aria-label="工作台助手">
      <div class="ai-head">
        <span class="ai-avatar">助</span>
        <div>
          <div class="ai-name">工作台助手</div>
          <div class="ai-stage stage-local">本地规则引擎</div>
        </div>
        <button type="button" class="ai-collapse" id="ai-collapse" title="收起助手" aria-label="收起助手" aria-expanded="true">»</button>
      </div>
      <div class="ai-chips" id="ai-chips">
        <button type="button" class="chip" data-prompt="明天下午3点 交周报 #工作 紧急">创建任务</button>
        <button type="button" class="chip" data-prompt="今天我要做什么">查看今日</button>
        <button type="button" class="chip" data-prompt="把 写季度方案 拆成三步">拆分任务</button>
        <button type="button" class="chip" data-prompt="怎么安排今天的优先级">安排建议</button>
      </div>
      <div class="ai-chat" id="ai-chat" role="log" aria-live="polite" aria-relevant="additions" aria-busy="true">
        <div class="load-state compact" role="status">
          <span class="load-indicator" aria-hidden="true"></span>
          <div><strong>正在同步工作状态</strong></div>
        </div>
      </div>
      <form class="ai-input-row" id="ai-form">
        <textarea id="ai-input" rows="1" maxlength="1000" aria-label="给工作台助手发消息，Enter 发送，Shift+Enter 换行" placeholder="描述任务，或继续补充…"></textarea>
        <button type="submit" class="btn" id="ai-send">发送</button>
      </form>
    </aside>
  </div>

  <!-- 任务编辑弹窗 -->
  <div class="modal-mask hidden" id="modal-mask" aria-hidden="true">
    <div class="modal task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h5 id="modal-title">新建任务</h5>
        <button type="button" class="modal-close" id="m-close" title="关闭" aria-label="关闭任务编辑">✕</button>
      </div>
      <form id="task-form" novalidate>
        <div class="task-modal-fields">
        <label for="m-title">标题 *</label>
        <input id="m-title" maxlength="100" required aria-describedby="m-title-error">
        <div class="field-error hidden" id="m-title-error" aria-live="polite"></div>
        <label for="m-desc">描述</label>
        <textarea id="m-desc" maxlength="500" rows="2" placeholder="补充任务细节…"></textarea>
        <div class="m-row">
          <div class="m-col">
            <label for="m-pri">优先级</label>
            <select id="m-pri">
              <option value="4">紧急</option>
              <option value="3">高</option>
              <option value="2" selected>中</option>
              <option value="1">低</option>
            </select>
          </div>
          <div class="m-col">
            <label for="m-status">状态</label>
            <select id="m-status">
              <option value="todo">待办</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </div>
        </div>
        <div class="m-row">
          <div class="m-col">
            <label for="m-due-date">截止日期</label>
            <div class="due-row">
              <input id="m-due-date" type="date">
              <input id="m-due-time" type="time" value="18:00" aria-label="截止时间">
              <button type="button" class="btn mini ghost" id="m-due-clear" title="清除截止时间" aria-label="清除截止时间">✕</button>
            </div>
          </div>
          <div class="m-col">
            <label for="m-tags">标签（逗号分隔）</label>
            <input id="m-tags" placeholder="工作, 生活">
          </div>
        </div>
        <div class="m-row">
          <div class="m-col">
            <label for="m-project">项目</label>
            <input id="m-project" placeholder="如：Q3 规划" maxlength="30">
          </div>
          <div class="m-col">
            <label for="m-repeat">重复</label>
            <select id="m-repeat">
              <option value="">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </div>
        </div>
        <div class="m-row">
          <div class="m-col">
            <label for="m-remind">提醒</label>
            <select id="m-remind">
              <option value="0">不提醒</option>
              <option value="10">提前 10 分钟</option>
              <option value="30" selected>提前 30 分钟</option>
              <option value="60">提前 1 小时</option>
            </select>
          </div>
        </div>
        <label for="m-children">子任务（每行一个，[x] 前缀表示已完成）</label>
        <textarea id="m-children" rows="3" placeholder="[ ] 搭框架&#10;[ ] 写初稿&#10;[ ] 内部校对"></textarea>
        <div class="form-error hidden" id="modal-error" role="alert"></div>
        </div>
        <div class="m-actions">
          <button type="button" class="btn ghost danger hidden" id="m-delete">删除</button>
          <button type="button" class="btn ghost hidden" id="m-archive">归档</button>
          <button type="button" class="btn ghost hidden" id="m-unarchive">恢复</button>
          <div class="m-spacer"></div>
          <button type="button" class="btn ghost" id="m-cancel">取消</button>
          <button type="submit" class="btn" id="m-save">创建</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask hidden" id="confirm-mask" aria-hidden="true">
    <div class="modal small" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h5 id="confirm-title">确认删除</h5>
      <p id="confirm-text">确定要删除这条任务吗？</p>
      <div class="m-actions">
        <button type="button" class="btn ghost" id="confirm-cancel">取消</button>
        <button type="button" class="btn danger" id="confirm-ok">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-layer" id="toast-layer"></div>

  <script src="js/app.js"></script>
</body>
</html>
