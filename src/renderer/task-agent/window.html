<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>任务对话</title>
  <link rel="stylesheet" href="window.css" />
</head>
<body>
  <div class="ta-window">
    <header class="ta-head" id="ta-head">
      <div class="ta-identity">
        <span class="ta-mark" aria-hidden="true">协</span>
        <div class="ta-identity-text">
          <strong id="ta-title">任务对话</strong>
          <span id="ta-subtitle">和 Agent 一起推进这项任务</span>
        </div>
      </div>
      <button type="button" class="ta-close" id="ta-close" title="关闭" aria-label="关闭任务对话">
        <svg class="ta-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>

    <div class="ta-chips" id="ta-chips" role="group" aria-label="快捷指令">
      <button type="button" class="ta-chip" data-prompt="改到明天">改到明天</button>
      <button type="button" class="ta-chip" data-prompt="设为紧急">设为紧急</button>
      <button type="button" class="ta-chip" data-prompt="进展：">记录进展</button>
      <button type="button" class="ta-chip" data-prompt="拆成三步">拆成三步</button>
    </div>

    <div class="ta-thread" id="ta-thread" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="ta-state" id="ta-state" aria-live="polite"></div>

    <form class="ta-input-row" id="ta-form">
      <textarea id="ta-input" rows="1" maxlength="1000" aria-label="描述要做的修改，Enter 发送，Shift+Enter 换行" placeholder="描述修改，或继续补充…"></textarea>
      <button type="submit" class="ta-send" id="ta-send">发送</button>
    </form>
  </div>
  <script src="window.js"></script>
</body>
</html>
